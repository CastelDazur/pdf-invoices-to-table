name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -B -m unittest -v
      - name: Sample gives exactly expected_output
        shell: bash
        run: |
          python -B pdf_to_table.py input --out "$RUNNER_TEMP/out"
          diff -r "$RUNNER_TEMP/out" expected_output
